# run: maestro test -p web --headless -e API_URL=http://localhost:5000/api/v1 .maestro/hit-counter/01-count-visible.yaml
# needs: backend (port 5000) and frontend (port 3000) running
url: http://localhost:3000
---
- runScript:
    file: scripts/hit-count.js
    env:
      API_URL: ${API_URL}
- launchApp
- assertVisible: "Kothay Khelbo"
- assertVisible: "Hits: ${output.count}"
- assertVisible: "Hit the API"
